version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=nitipath_super_secret_jwt_key_sih2024_2026_production
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGIN=http://localhost:3000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
